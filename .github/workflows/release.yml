name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to package, for example v0.1.0-alpha.1"
        required: true
      dry_run:
        description: "Build and package without creating/updating a release"
        required: false
        default: "true"

permissions:
  contents: read

env:
  ZIG_VERSION: "0.16.0"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
            git fetch --tags --force
            git checkout "${tag}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "release tag must look like v0.1.0 or v0.1.0-alpha.1" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${tag#v}" >> "${GITHUB_OUTPUT}"

      - name: Set up Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned compatibility fixtures
        uses: ./.github/actions/setup-oracles

      - name: Check whitespace
        run: git show --check --format=short --no-renames HEAD

      - name: Check Zig formatting
        run: |
          zig fmt --check build.zig build.zig.zon
          find src -name '*.zig' -print0 | sort -z | xargs -0 zig fmt --check

      - name: Run public-safety scan
        run: python scripts/check_public_safety.py

      - name: Check runtime boundary
        run: python scripts/check_runtime_boundary.py

      - name: Build Zig binary
        run: zig build --summary all

      - name: Run Zig tests
        run: zig build test --summary all

      - name: Build release-safe binary
        run: zig build -Doptimize=ReleaseSafe --summary all

      - name: Certify complete compatibility suite
        run: pytest -q --junitxml=.agent/runs/release-tests.xml

      - name: Certify clean native installation and performance budgets
        run: |
          zig build -Doptimize=ReleaseSafe --summary all
          python scripts/check_install.py --version "${{ steps.version.outputs.version }}"
          python scripts/check_performance.py

      - name: Version consistency
        run: |
          test "$(./zig-out/bin/dxt version)" = "${{ steps.version.outputs.version }}"
          rg -q ".version = \"${{ steps.version.outputs.version }}\"" build.zig.zon

  package:
    name: package ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-linux-gnu
            runner: ubuntu-24.04-arm

    services:
      postgres:
        image: postgres:17.7
        env:
          POSTGRES_PASSWORD: installation_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DXT_INSTALL_POSTGRES_URI: postgresql://postgres:installation_fixture@localhost:5432/postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - name: Set up Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build target
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }} --summary all

      - name: Smoke test native target
        run: |
          ./zig-out/bin/dxt --help
          test "$(./zig-out/bin/dxt version)" = "${{ needs.verify.outputs.version }}"

      - name: Install native fixtures on the actual target
        uses: ./.github/actions/setup-native-duckdb

      - name: Install complete artifact and database validation tools
        run: python -m pip install dbt-core==1.10.5 dbt-duckdb==1.9.6 dbt-postgres==1.9.1 duckdb==1.4.2 jsonschema==4.26.0

      - name: Run all native tests on the actual target
        run: zig build test -Dtarget=${{ matrix.target }} --summary all

      - name: Package the actual release target with docs and upstream licenses
        run: python scripts/package_release.py --version "${{ needs.verify.outputs.version }}" --target "${{ matrix.target }}"

      - name: Check release archive safety
        run: |
          python scripts/check_release_archive.py \
            "dist/dxt-v${{ needs.verify.outputs.version }}-${{ matrix.target }}.tar.gz" \
            --version "${{ needs.verify.outputs.version }}" \
            --target "${{ matrix.target }}"

      - name: Certify extracted archive with both live adapters and PATH empty
        run: python scripts/check_install.py --archive "dist/dxt-v${{ needs.verify.outputs.version }}-${{ matrix.target }}.tar.gz" --version "${{ needs.verify.outputs.version }}" --require-postgres

      - name: Upload packaged binary
        uses: actions/upload-artifact@v4
        with:
          name: dxt-${{ needs.verify.outputs.tag }}-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: create draft release
    runs-on: ubuntu-latest
    needs:
      - verify
      - package
    if: github.event_name == 'push' || inputs.dry_run != 'true'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz > "dxt-${{ needs.verify.outputs.tag }}-SHA256SUMS.txt"
          cat "dxt-${{ needs.verify.outputs.tag }}-SHA256SUMS.txt"

      - name: Check release archives and checksums
        run: |
          python scripts/check_release_archive.py \
            dist/*.tar.gz \
            --version "${{ needs.verify.outputs.version }}" \
            --checksum-file "dist/dxt-${{ needs.verify.outputs.tag }}-SHA256SUMS.txt"

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ needs.verify.outputs.tag }}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" dist/* --clobber
          else
            gh release create "${tag}" dist/* \
              --draft \
              --verify-tag \
              --title "dxt ${tag}" \
              --generate-notes
          fi
