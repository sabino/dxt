name: Release

on:
  push:
    tags:
      - "v*.*.*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to package"
        type: string
        required: true
      dry_run:
        description: "Build and validate without uploading release assets"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  qualify:
    name: qualify tagged source against green PR CI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      version: ${{ steps.source.outputs.version }}
      revision: ${{ steps.source.outputs.revision }}
      prerelease: ${{ steps.source.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require a matching version and complete PR validation for the exact source tree
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
        run: >-
          python scripts/release_workflow.py prepare --tag "$RELEASE_TAG"
          --github-output "$GITHUB_OUTPUT" --record-dir release-evidence
      - uses: actions/upload-artifact@v4
        with:
          name: release-source
          path: release-evidence/*
          if-no-files-found: error

  linux:
    name: package ${{ matrix.target }}
    needs: qualify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-linux-gnu
            runner: ubuntu-24.04-arm
    services:
      postgres:
        image: postgres:17.7
        env:
          POSTGRES_PASSWORD: installation_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DXT_INSTALL_POSTGRES_URI: postgresql://postgres:installation_fixture@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.qualify.outputs.revision }}
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: "0.16.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-release.txt
      - name: Install developer-only artifact and warehouse fixtures
        run: python -m pip install -r requirements-release.txt
      - name: Install checksum-verified native DuckDB fixtures
        uses: ./.github/actions/setup-native-duckdb
      - name: Build qualified ReleaseSafe target
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }} --summary all
      - name: Package target with documentation and upstream licenses
        run: python scripts/package_release.py --version "${{ needs.qualify.outputs.version }}" --target "${{ matrix.target }}"
      - name: Generate checksum before opening the archive
        run: |
          cd dist
          sha256sum "dxt-v${{ needs.qualify.outputs.version }}-${{ matrix.target }}.tar.gz" > "dxt-v${{ needs.qualify.outputs.version }}-${{ matrix.target }}-SHA256SUMS.txt"
      - name: Certify extracted archive with both live adapters and PATH empty
        run: >-
          python scripts/check_install.py --archive "dist/dxt-v${{ needs.qualify.outputs.version }}-${{ matrix.target }}.tar.gz"
          --checksum-file "dist/dxt-v${{ needs.qualify.outputs.version }}-${{ matrix.target }}-SHA256SUMS.txt"
          --version "${{ needs.qualify.outputs.version }}" --require-postgres
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  macos:
    name: package standalone macOS
    needs: qualify
    uses: ./.github/workflows/macos-package.yml
    with:
      source_ref: ${{ needs.qualify.outputs.revision }}
      version: ${{ needs.qualify.outputs.version }}
      native_tests: false

  publish:
    name: publish validated release downloads
    needs: [qualify, linux, macos]
    if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.qualify.outputs.revision }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate combined checksums
        env:
          RELEASE_TAG: ${{ needs.qualify.outputs.tag }}
        run: |
          cd dist
          sha256sum *.tar.gz > "dxt-${RELEASE_TAG}-SHA256SUMS.txt"
      - name: Require every target archive and verify checksums, headers, notices and safe contents
        env:
          RELEASE_TAG: ${{ needs.qualify.outputs.tag }}
          RELEASE_VERSION: ${{ needs.qualify.outputs.version }}
        run: >-
          python scripts/check_release_archive.py dist/*.tar.gz --version "$RELEASE_VERSION"
          --checksum-file "dist/dxt-${RELEASE_TAG}-SHA256SUMS.txt" --require-all-targets
      - name: Reject a tag moved after qualification
        env:
          RELEASE_TAG: ${{ needs.qualify.outputs.tag }}
          RELEASE_REVISION: ${{ needs.qualify.outputs.revision }}
        run: python scripts/release_workflow.py check-tag --tag "$RELEASE_TAG" --revision "$RELEASE_REVISION"
      - name: Create release or attach downloads to an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.qualify.outputs.tag }}
          PRERELEASE: ${{ needs.qualify.outputs.prerelease }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
            gh release edit "$RELEASE_TAG" --draft=false
          elif [ "$PRERELEASE" = true ]; then
            gh release create "$RELEASE_TAG" dist/* --verify-tag --prerelease --latest=false --title "dxt ${RELEASE_TAG}" --generate-notes
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --title "dxt ${RELEASE_TAG}" --generate-notes
          fi
