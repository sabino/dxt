name: Diagnose original c81 X64 pytest report

on:
  push:
    branches:
      - ci/diagnose-c81-arm64-report
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  failed-x64-report-diagnostic:
    name: diagnose sealed original X64 failure report
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AUDIT_SOURCE_HEAD: c81a20b2de35f2bb0d409d41eb24002792247a31
      AUDIT_SOURCE_TREE: c45add2e6422a5e0ff14eb88c9d7988e4c3156b7
      AUDIT_ORIGINAL_RUN: "38057848796"
      AUDIT_X64_JOB: "114229930872"
      AUDIT_X64_ARTIFACT: "11678034382"
      AUDIT_WORKFLOW_HEAD: ${{ github.sha }}
    steps:
      - name: Checkout the exact original candidate
        uses: actions/checkout@v4
        with:
          ref: c81a20b2de35f2bb0d409d41eb24002792247a31
          persist-credentials: false

      - name: Verify source commit and tree
        run: |
          test "$(git rev-parse HEAD)" = "$AUDIT_SOURCE_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$AUDIT_SOURCE_TREE"
          git diff --quiet --exit-code
          git diff --cached --quiet --exit-code
          CI_REPORT_AUDIT_DIR="$RUNNER_TEMP/dxt-c81-x64-report-diagnostic"
          echo "CI_REPORT_AUDIT_DIR=$CI_REPORT_AUDIT_DIR" >> "$GITHUB_ENV"
          mkdir -p "$CI_REPORT_AUDIT_DIR"

      - name: Verify the sealed failed X64 job and original artifact provenance
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run_id = Number(process.env.AUDIT_ORIGINAL_RUN);
            const job_id = Number(process.env.AUDIT_X64_JOB);
            const artifact_id = Number(process.env.AUDIT_X64_ARTIFACT);
            const source_head = process.env.AUDIT_SOURCE_HEAD;
            const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id });
            if (run.id !== run_id || run.head_sha !== source_head || run.run_attempt !== 1 ||
                run.repository.full_name !== `${owner}/${repo}` || run.path !== '.github/workflows/ci.yml' ||
                run.status !== 'completed' || run.conclusion !== 'failure') {
              throw new Error('Original CI run source, repository, workflow or attempt does not match');
            }
            const { data: job } = await github.rest.actions.getJobForWorkflowRun({ owner, repo, job_id });
            if (job.id !== job_id || job.run_id !== run_id || job.head_sha !== source_head ||
                job.name !== 'test py3.12' || job.status !== 'completed' || job.conclusion !== 'failure') {
              throw new Error('Original X64 job must be the sealed completed failed canonical job');
            }
            const test_step = job.steps.filter(step => step.name === 'Run the complete canonical Core compatibility suite');
            if (test_step.length !== 1 || test_step[0].status !== 'completed' || test_step[0].conclusion !== 'failure') {
              throw new Error('Original X64 canonical test step must be completed with failure');
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, { owner, repo, run_id });
            const matches = artifacts.filter(artifact => artifact.name === 'pytest-3.12-X64');
            if (matches.length !== 1 || matches[0].id !== artifact_id || matches[0].expired ||
                matches[0].workflow_run?.id !== run_id || matches[0].workflow_run?.head_sha !== source_head ||
                matches[0].size_in_bytes !== 650141 ||
                matches[0].digest !== 'sha256:71c007e123de624acc7cc19c146f760848a398c7f298115bfd87f52864f68938') {
              throw new Error('Original X64 artifact ID, source-run metadata or expiry does not match');
            }
            console.log(JSON.stringify({ kind: 'DIAGNOSTIC FAILED REPORT', acceptance: false, original_run_id: run_id,
              source_head, source_tree: process.env.AUDIT_SOURCE_TREE, original_run_attempt: run.run_attempt,
              original_run_status: run.status, original_run_conclusion: run.conclusion,
              sealed_x64_job_id: job_id, x64_job_status: job.status, x64_job_conclusion: job.conclusion,
              artifact_id, artifact_name: matches[0].name }));

      - name: Set up the canonical Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install original collection dependencies and native fixtures
        uses: ./.github/actions/setup-oracles

      - name: Collect all original test identities without running tests or builds
        run: |
          python -m pytest --collect-only -q > "$CI_REPORT_AUDIT_DIR/collection.log"

      - name: Download the original X64 pytest report
        uses: actions/download-artifact@v4
        with:
          name: pytest-3.12-X64
          path: ${{ env.CI_REPORT_AUDIT_DIR }}/reports/x64
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38057848796

      - name: Diagnose original failed report without an acceptance claim
        run: |
          python - <<'PY'
          import collections
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import xml.etree.ElementTree as ET
          from _pytest.junitxml import mangle_test_address

          directory = Path(os.environ['CI_REPORT_AUDIT_DIR'])
          expected = [line.strip() for line in (directory / 'collection.log').read_text().splitlines()
                      if line.startswith('tests/') and '::' in line]
          if len(expected) != 5819 or len(set(expected)) != 5819:
              raise SystemExit('Original collection must contain exactly 5819 unique test identities')
          expected_keys = {}
          for node_id in expected:
              names = mangle_test_address(node_id)
              key = ('.'.join(names[:-1]), names[-1])
              if key in expected_keys:
                  raise SystemExit('Collected identities have an ambiguous JUnit mapping')
              expected_keys[key] = node_id
          reports = [path for path in (directory / 'reports' / 'x64').rglob('*') if path.is_file()]
          if len(reports) != 1 or reports[0].name != 'pytest-3.12-X64.xml':
              raise SystemExit('Artifact must contain exactly its original X64 XML report')
          report = reports[0]
          root = ET.parse(report).getroot()
          if root.tag not in {'testsuite', 'testsuites'}:
              raise SystemExit('Expected original pytest JUnit report')
          suites = [root] if root.tag == 'testsuite' else list(root.iter('testsuite'))
          if not suites or any(suite.find('testsuite') is not None for suite in suites):
              raise SystemExit('Expected pytest leaf suites')
          declared = {name: sum(int(suite.attrib[name]) for suite in suites)
                      for name in ('tests', 'failures', 'errors', 'skipped')}
          cases = list(root.iter('testcase'))
          keys = [(case.attrib.get('classname'), case.attrib.get('name')) for case in cases]
          identities = [expected_keys.get(key) for key in keys]
          complete = (len(cases) == 5819 and len(set(keys)) == 5819 and set(keys) == set(expected_keys))
          identity_guard_failed = len(cases) == 5819 and not complete
          counts = collections.Counter()
          diagnostic_cases = []
          full_details = []
          for index, case in enumerate(cases):
              details = [(name, case.find(name)) for name in ('failure', 'error', 'skipped') if case.find(name) is not None]
              status = details[0][0] if details else 'passed'
              if details:
                  counts.update(name for name, _ in details)
              else:
                  counts['passed'] += 1
              if details:
                  identity = identities[index]
                  descriptor = {'node_id': identity, 'status': status, 'statuses': [name for name, _ in details]}
                  if identity is None:
                      descriptor['unmapped_junit_identity'] = {'classname': keys[index][0], 'name': keys[index][1]}
                  diagnostic_cases.append(descriptor)
                  text = '\n'.join((element.attrib.get('message', '') + '\n' + (element.text or '')).strip()
                                   for _, element in details)
                  full_details.append((descriptor, text))
          ids_hash = lambda values: hashlib.sha256(('\n'.join(sorted(values)) + '\n').encode()).hexdigest()
          if ids_hash(expected) != '96257d8ef271320a31929990a0fc7cbfbeafff6adb8ae2da06ef0af4411bd011':
              raise SystemExit('Original collected identity digest differs from the held 5819 identities')
          summary = {'kind': 'DIAGNOSTIC FAILED REPORT', 'acceptance': False,
                     'diagnostic_mode': 'all_failures_bounded_text', 'failure_text_start': 0,
                     'source_head': os.environ['AUDIT_SOURCE_HEAD'], 'source_tree': os.environ['AUDIT_SOURCE_TREE'],
                     'audit_workflow_head': os.environ['AUDIT_WORKFLOW_HEAD'],
                     'original_run_id': int(os.environ['AUDIT_ORIGINAL_RUN']),
                     'sealed_x64_job_id': int(os.environ['AUDIT_X64_JOB']),
                     'original_artifact_id': int(os.environ['AUDIT_X64_ARTIFACT']),
                     'report_sha256': hashlib.sha256(report.read_bytes()).hexdigest(),
                     'expected_tests': len(expected), 'declared_counts': declared,
                     'actual_counts': {'tests': len(cases), 'passed': counts['passed'], 'failures': counts['failure'],
                                       'errors': counts['error'], 'skipped': counts['skipped']},
                     'complete_exact_unique_identity_set': complete, 'duplicate_identities': len(keys) - len(set(keys)),
                     'missing_expected_identities': len(set(expected_keys) - set(keys)),
                     'unexpected_identities': len(set(keys) - set(expected_keys)),
                     'expected_ids_sha256': ids_hash(expected),
                     'actual_ids_sha256': ids_hash(identities) if complete else None,
                     'all_failed_error_skipped_cases': len(diagnostic_cases), 'maximum_output_bytes': 102400}
          # Retain complete diagnostic identities next to the unchanged downloaded XML.
          (directory / 'diagnostic-case-ids.json').write_text(json.dumps(diagnostic_cases, indent=2) + '\n')
          encode = lambda value: json.dumps(value, ensure_ascii=True, sort_keys=True) + '\n'
          summary_line = encode(summary)
          print(summary_line, end='')
          lines = []
          for start in range(0, len(diagnostic_cases), 10):
              lines.append(encode({'kind': 'DIAGNOSTIC CASE IDS', 'start': start,
                                   'cases': diagnostic_cases[start:start + 10]}))
          used = len(summary_line.encode()) + sum(len(line.encode()) for line in lines)
          if used > 102400:
              raise SystemExit('Complete diagnostic identities exceed the 100 KiB log budget; original report and complete ID file retained')
          secrets = sorted((value for name, value in os.environ.items()
                            if name.startswith('DBT_ENV_SECRET_') and value.strip()), key=len, reverse=True)
          # Divide the remaining log budget fairly so every diagnostic case
          # receives bounded text, rather than silently clipping the tail.
          for index, (descriptor, raw_text) in enumerate(full_details):
              text = raw_text
              for value in secrets:
                  text = text.replace(value, '*****')
              text = re.sub(r'\b(?:github_pat_[A-Za-z0-9_]+|gh[pousr]_[A-Za-z0-9]+)\b', '*****', text)
              text = re.sub(r'(?i)\bBearer\s+[A-Za-z0-9._~+/=-]+', 'Bearer *****', text)
              record = dict(descriptor, kind='DIAGNOSTIC BOUNDED FAILURE TEXT', original_text_chars=len(raw_text),
                            text_slice='first_up_to_2000_budgeted', text=text[:2000])
              remaining_cases = len(full_details) - index
              case_budget = (102400 - used) // remaining_cases
              line = encode(record)
              while len(line.encode()) > case_budget and record['text']:
                  record['text'] = record['text'][:max(0, len(record['text']) - max(1, len(record['text']) // 4))]
                  line = encode(record)
              if len(line.encode()) > case_budget:
                  continue  # Counts and every identity remain printed and retained.
              lines.append(line)
              used += len(line.encode())
          if subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() != os.environ['AUDIT_SOURCE_HEAD']:
              raise SystemExit('Source commit changed during diagnosis')
          if subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip() != os.environ['AUDIT_SOURCE_TREE']:
              raise SystemExit('Source tree changed during diagnosis')
          subprocess.run(['git', 'diff', '--quiet', '--exit-code'], check=True)
          subprocess.run(['git', 'diff', '--cached', '--quiet', '--exit-code'], check=True)
          print(''.join(lines), end='')
          if identity_guard_failed:
              raise SystemExit('A complete-count report has incorrect or duplicate test identities')
          PY

      - name: Preserve the original report and complete diagnostic identities
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-original-c81-X64-report
          path: |
            ${{ env.CI_REPORT_AUDIT_DIR }}/reports/x64/pytest-3.12-X64.xml
            ${{ env.CI_REPORT_AUDIT_DIR }}/diagnostic-case-ids.json
            ${{ env.CI_REPORT_AUDIT_DIR }}/collection.log
          if-no-files-found: error
