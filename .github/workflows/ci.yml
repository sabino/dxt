name: ARM workflow binding ownership diagnostic

on:
  push:
    branches:
      - ci/diagnose-arm-bindings-15d819a
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIG_VERSION: "0.16.0"

jobs:
  actual-arm-native:
    name: corrected workflow binding ownership native ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.7
        env:
          POSTGRES_PASSWORD: installation_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DXT_INSTALL_POSTGRES_URI: postgresql://postgres:installation_fixture@localhost:5432/postgres
    steps:
      - name: Checkout the diagnostic source
        uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install complete artifact and database validation tools
        run: python -m pip install dbt-core==1.10.5 dbt-duckdb==1.9.6 dbt-postgres==1.9.1 duckdb==1.4.2 jsonschema==4.26.0
      - name: Install native adapter fixtures
        uses: ./.github/actions/setup-native-duckdb
      - name: Record source and require the actual ARM runner
        run: |
          test "$(uname -m)" = aarch64
          git merge-base --is-ancestor 15d819a8e29326d4f5f9719681d44be19a814956 HEAD
          test "$(git rev-parse 15d819a8e29326d4f5f9719681d44be19a814956^)" = e244ad16664ea9ab4cff328fb2609f1f9dbfa374
          test "$(git diff --name-only 15d819a8e29326d4f5f9719681d44be19a814956 HEAD)" = .github/workflows/ci.yml
          git diff --exit-code
          git diff --cached --quiet --exit-code
          printf '%s\n' '674a810e467b5fcb4a4435c7d2d0461b779be3c30f87119b226f0dad95568fe5  src/project/workflow.zig' | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/dxt-arm-bindings-evidence"
          {
            git rev-parse HEAD
            uname -m
            zig version
            sha256sum src/project/workflow.zig
          } > "$RUNNER_TEMP/dxt-arm-bindings-evidence/provenance.txt"
      - name: Test all original native cases on the actual target
        shell: bash
        run: |
          set -o pipefail
          private_cache="$(mktemp -d "$RUNNER_TEMP/dxt-arm-bindings-private.XXXXXX")"
          ZIG_GLOBAL_CACHE_DIR="$private_cache/global" ZIG_LOCAL_CACHE_DIR="$private_cache/local" \
            zig build test -Dtarget=aarch64-linux-gnu --summary all 2>&1 | tee "$RUNNER_TEMP/dxt-arm-bindings-evidence/native.log"
          python - <<'PYTHON'
          from pathlib import Path
          import os, re
          log = Path(os.environ["RUNNER_TEMP"]) / "dxt-arm-bindings-evidence/native.log"
          assert re.findall(r"(\d+)/(\d+) tests passed", log.read_text()) == [("817", "817")]
          PYTHON
          git diff --exit-code
          git diff --cached --quiet --exit-code
          printf '%s\n' '674a810e467b5fcb4a4435c7d2d0461b779be3c30f87119b226f0dad95568fe5  src/project/workflow.zig' | sha256sum --check -
          sha256sum src/project/workflow.zig > "$RUNNER_TEMP/dxt-arm-bindings-evidence/source-after.txt"
      - name: Retain the native-only diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-arm-workflow-binding-ownership-native-evidence
          path: ${{ runner.temp }}/dxt-arm-bindings-evidence
          if-no-files-found: error
