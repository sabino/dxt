name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: "0.16.0"
  DUCKDB_VERSION: "1.4.2"
  DUCKDB_CLI_SHA256: "fae3ba93eedf20b08bca4b23aeac1ba94c446f1c10d029c193e2fc4b4e0bc1bc"
  JAFFLE_SHOP_DUCKDB_REPO: "https://github.com/dbt-labs/jaffle_shop_duckdb.git"
  JAFFLE_SHOP_DUCKDB_REF: "36bde6cba69d962b83be1d52fc65a0dce1cb4ebb"

jobs:
  platform-installation:
    name: native installation ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-linux-gnu
            runner: ubuntu-24.04-arm
    services:
      postgres:
        image: postgres:17.7
        env:
          POSTGRES_PASSWORD: installation_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DXT_INSTALL_POSTGRES_URI: postgresql://postgres:installation_fixture@localhost:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install complete artifact and database validation tools
        run: python -m pip install dbt-core==1.10.5 dbt-duckdb==1.9.6 dbt-postgres==1.9.1 duckdb==1.4.2 jsonschema==4.26.0
      - name: Install native adapter fixtures
        uses: ./.github/actions/setup-native-duckdb
      - name: Test the actual target
        run: zig build test -Dtarget=${{ matrix.target }} --summary all
      - name: Build the release-safe target
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }} --summary all
      - name: Package the actual release target with docs and upstream licenses
        run: python scripts/package_release.py --target ${{ matrix.target }}
      - name: Generate the target archive checksum before extracted installation
        run: |
          cd dist
          sha256sum "dxt-v0.0.0-${{ matrix.target }}.tar.gz" > "dxt-v0.0.0-${{ matrix.target }}-SHA256SUMS.txt"
      - name: Certify both adapters from the actual release archive with PATH empty
        run: python scripts/check_install.py --archive dist/dxt-v0.0.0-${{ matrix.target }}.tar.gz --checksum-file dist/dxt-v0.0.0-${{ matrix.target }}-SHA256SUMS.txt --require-postgres

  public-package:
    name: unchanged public dbt-utils PostgreSQL project
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install compatibility fixtures
        uses: ./.github/actions/setup-oracles
      - name: Build the release-safe native binary
        run: zig build -Doptimize=ReleaseSafe
      - name: Certify unchanged package installation, SQL, artifacts and rows against Core
        run: python scripts/check_dbt_utils.py --adapter postgres

  native:
    name: native zig and safety
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Print tool versions
        run: |
          zig version
          python --version

      - name: Check whitespace
        run: git show --check --format=short --no-renames HEAD

      - name: Check Zig formatting
        run: |
          zig fmt --check build.zig build.zig.zon
          find src -name '*.zig' -print0 | sort -z | xargs -0 zig fmt --check

      - name: Run public-safety scan
        run: python scripts/check_public_safety.py

      - name: Check runtime boundary
        run: python scripts/check_runtime_boundary.py

      - name: Build Zig binary
        run: zig build --summary all

      - name: Run Zig tests
        run: zig build test --summary all

      - name: Build release-safe binary
        run: zig build -Doptimize=ReleaseSafe --summary all

  integration:
    name: test py3.11
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-oracle.txt

      - name: Set up Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install compatibility fixtures
        uses: ./.github/actions/setup-oracles

      - name: Print tool versions
        run: |
          zig version
          python --version

      - name: Run developer and native CLI checks
        run: >-
          python -m pytest -q
          --junitxml=reports/pytest-3.11-${{ runner.arch }}.xml
          tests/test_agent_os_orchestrator.py tests/test_github_agent_os.py
          tests/test_public_safety.py tests/test_runtime_boundary_metadata.py
          tests/test_compatibility_shards.py tests/test_pytest_report.py
          tests/test_artifact_json.py tests/test_cli.py tests/test_usability_adapters.py

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-3.11-${{ runner.arch }}
          path: reports/pytest-3.11-${{ runner.arch }}.xml
          if-no-files-found: ignore

  canonical-plan:
    name: collect complete canonical suite
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-oracle.txt
      - name: Install collection dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-oracle.txt
      - name: Collect every case and balance complete modules
        env:
          PYTHONPATH: scripts
        run: >-
          python -m pytest -q --collect-only -p pytest_shard
          --dxt-shard-count=8 --dxt-shard-timings=tests/compatibility_timings.json
          --dxt-shard-output=reports/canonical-plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-plan
          path: reports/canonical-plan.json
          if-no-files-found: error

  canonical-shards:
    name: Core ${{ matrix.platform.arch }} shard ${{ matrix.shard }}
    needs: canonical-plan
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      # Collect all failure evidence, rather than canceling sibling shards.
      fail-fast: false
      max-parallel: 16
      matrix:
        platform:
          - runner: ubuntu-24.04
            arch: X64
          - runner: ubuntu-24.04-arm
            arch: ARM64
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-oracle.txt
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install compatibility fixtures
        uses: ./.github/actions/setup-oracles
      - uses: actions/download-artifact@v4
        with:
          name: canonical-plan
          path: reports
      # Core globals and module fixtures remain isolated on separate runners.
      # No cases or upstream CLI assertions are removed by this distribution.
      - name: Execute the assigned canonical modules
        env:
          PYTHONPATH: scripts
        run: >-
          python -m pytest -q -p pytest_shard
          --dxt-shard-plan=reports/canonical-plan.json
          --dxt-shard-index=${{ matrix.shard }}
          --dxt-shard-output=reports/shards/shard-${{ matrix.shard }}.json
          --junitxml=reports/shards/shard-${{ matrix.shard }}.xml
      - name: Upload execution identities and JUnit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-${{ matrix.platform.arch }}-${{ matrix.shard }}
          path: reports/shards/
          if-no-files-found: error

  canonical-acceptance:
    # Stable branch-protection contexts now certify the union of every shard.
    name: ${{ matrix.context }}
    if: always()
    needs: [canonical-plan, canonical-shards]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: X64
            machine: x86_64
            context: test py3.12
          - arch: ARM64
            machine: aarch64
            context: test py3.12 aarch64
    steps:
      - uses: actions/checkout@v4
      - name: Require successful collection and all workers
        env:
          COLLECTION_RESULT: ${{ needs.canonical-plan.result }}
          SHARDS_RESULT: ${{ needs.canonical-shards.result }}
        run: |
          test "$COLLECTION_RESULT" = success
          test "$SHARDS_RESULT" = success
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: canonical-plan
          path: reports
      - uses: actions/download-artifact@v4
        with:
          pattern: canonical-${{ matrix.arch }}-*
          path: reports/shards
          merge-multiple: true
      - name: Require every collected case to pass exactly once on the actual architecture
        run: >-
          python scripts/check_compatibility_shards.py --plan reports/canonical-plan.json
          --reports-dir reports/shards --expected-machine ${{ matrix.machine }}

  performance:
    name: cold and warm native performance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install compatibility fixtures
        uses: ./.github/actions/setup-oracles
      - name: Build release-safe binary
        run: zig build -Doptimize=ReleaseSafe
      - name: Verify an extracted binary without subprocess fallbacks
        run: python scripts/check_install.py
      - name: Certify compiled SQL and cold/warm budgets against Core
        run: python scripts/check_performance.py --report .agent/runs/performance.json
      - name: Upload measured performance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-performance
          path: .agent/runs/performance.json
          if-no-files-found: error

  snapshot-oracle:
    name: dbt snapshot oracle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-oracle.txt

      - name: Set up Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install compatibility fixtures
        uses: ./.github/actions/setup-oracles

      - name: Compare SQL snapshots with dbt Core and the full Snapshot schema
        run: pytest -q tests/test_cli.py::test_snapshot_dbt_core_1105_oracle

  public-fixtures:
    # Keep this context name stable for branch protection; the job now runs
    # public Jaffle parse, ls, compile, DuckDB build/run, and docs-generate gates.
    name: public jaffle parse gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install compatibility fixtures
        uses: ./.github/actions/setup-oracles

      - name: Fetch public Jaffle fixture
        run: |
          git clone "${JAFFLE_SHOP_DUCKDB_REPO}" "$RUNNER_TEMP/jaffle_shop_duckdb"
          git -C "$RUNNER_TEMP/jaffle_shop_duckdb" checkout "${JAFFLE_SHOP_DUCKDB_REF}"
          git -C "$RUNNER_TEMP/jaffle_shop_duckdb" rev-parse HEAD

      - name: Run public Jaffle parse gate
        run: python scripts/check_jaffle_shop_duckdb_parse.py --project-dir "$RUNNER_TEMP/jaffle_shop_duckdb"

      - name: Run public Jaffle ls gate
        run: python scripts/check_jaffle_shop_duckdb_ls.py --no-build --project-dir "$RUNNER_TEMP/jaffle_shop_duckdb"

      - name: Run public Jaffle compile gate
        run: python scripts/check_jaffle_shop_duckdb_compile.py --no-build --project-dir "$RUNNER_TEMP/jaffle_shop_duckdb"

      - name: Run public Jaffle build gate
        run: python scripts/check_jaffle_shop_duckdb_build.py --no-build --project-dir "$RUNNER_TEMP/jaffle_shop_duckdb"

      - name: Run public Jaffle run gate
        run: python scripts/check_jaffle_shop_duckdb_run.py --no-build --project-dir "$RUNNER_TEMP/jaffle_shop_duckdb"

      - name: Run public Jaffle docs gate
        run: python scripts/check_jaffle_shop_duckdb_docs.py --no-build --project-dir "$RUNNER_TEMP/jaffle_shop_duckdb"

      - name: Verify DuckDB CLI autocommit query compatibility
        run: pytest -q tests/test_usability_adapters.py::test_cli_fallback_remains_available_and_normalizes_empty_rows
