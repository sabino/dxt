name: Set up compatibility fixtures
description: Install pinned developer oracles and checksum-verified DuckDB fixtures
runs:
  using: composite
  steps:
    - name: Install pinned oracle dependencies
      shell: bash
      run: python -m pip install -r requirements-dev.txt -r requirements-oracle.txt
    - name: Install DuckDB CLI and native library
      shell: bash
      run: |
        fixture_dir="$RUNNER_TEMP/dxt-adapter-fixtures"
        mkdir -p "$fixture_dir/bin" "$fixture_dir/lib"
        curl --fail --location --show-error \
          --output "$fixture_dir/duckdb_cli.zip" \
          "https://github.com/duckdb/duckdb/releases/download/v1.4.2/duckdb_cli-linux-amd64.zip"
        echo "fae3ba93eedf20b08bca4b23aeac1ba94c446f1c10d029c193e2fc4b4e0bc1bc  $fixture_dir/duckdb_cli.zip" | sha256sum --check -
        unzip -q "$fixture_dir/duckdb_cli.zip" -d "$fixture_dir/bin"
        curl --fail --location --show-error \
          --output "$fixture_dir/libduckdb.zip" \
          "https://github.com/duckdb/duckdb/releases/download/v1.4.2/libduckdb-linux-amd64.zip"
        echo "0a68e623cbdcfa06e10e1b5d6a3092d3fd3679f616008fb1a39b92e4a10d8f43  $fixture_dir/libduckdb.zip" | sha256sum --check -
        unzip -q "$fixture_dir/libduckdb.zip" -d "$fixture_dir/lib"
        chmod +x "$fixture_dir/bin/duckdb"
        echo "$fixture_dir/bin" >> "$GITHUB_PATH"
        echo "DXT_DUCKDB_LIBRARY=$fixture_dir/lib/libduckdb.so" >> "$GITHUB_ENV"
        echo "DXT_NATIVE_ADAPTER_CERTIFY=1" >> "$GITHUB_ENV"
        echo "DBT_SEND_ANONYMOUS_USAGE_STATS=false" >> "$GITHUB_ENV"
        "$fixture_dir/bin/duckdb" --version
