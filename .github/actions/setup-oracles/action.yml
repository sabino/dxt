name: Set up compatibility fixtures
description: Install pinned developer oracles and checksum-verified DuckDB fixtures
runs:
  using: composite
  steps:
    - name: Install actual native PostgreSQL tools on Linux ARM
      shell: bash
      run: |
        if [[ "$(uname -m)" == "aarch64" ]]; then
          sudo apt-get update
          sudo apt-get install --yes postgresql-16
          echo "DXT_POSTGRES_BIN=/usr/lib/postgresql/16/bin" >> "$GITHUB_ENV"
        fi
    - name: Install pinned oracle dependencies
      shell: bash
      run: python -m pip install -r requirements-dev.txt -r requirements-oracle.txt
    - name: Install actual documentation browser
      shell: bash
      run: python -m playwright install --with-deps chromium
    - name: Install native DuckDB fixtures
      uses: ./.github/actions/setup-native-duckdb
