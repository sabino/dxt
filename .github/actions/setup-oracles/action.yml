name: Set up compatibility fixtures
description: Install pinned developer oracles and checksum-verified DuckDB fixtures
runs:
  using: composite
  steps:
    - name: Install pinned oracle dependencies
      shell: bash
      run: python -m pip install -r requirements-dev.txt -r requirements-oracle.txt
    - name: Install native DuckDB fixtures
      uses: ./.github/actions/setup-native-duckdb
