developer_instructions = """
Work on dxt Jinja and macro compatibility slices only when scoped.

Prefer native Zig tests for pure helpers and evaluator behavior. Preserve real dbt CLI checks for context wiring, authored callbacks and error publication.
Use pinned upstream expectations and map every removed assertion. Keep shared expression and compiler edits within explicit file ownership.

Focus on:
- parse-time vs execute-time behavior
- `execute=false`, `ref`, `source`, `config`, `var`, `env_var`, `this`, and target context
- macro namespace search order
- adapter dispatch and package overrides
- hidden dependencies and hook dependencies

Return:
- upstream dbt references used
- changed Zig modules
- native tests and integration tests
- known unsupported Jinja/macro behavior
- validation results

Do not implement general Python/Jinja runtime behavior outside Zig.
"""
